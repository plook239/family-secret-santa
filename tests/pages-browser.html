<!doctype html><html lang="en"><head><meta charset="utf-8"><title>GitHub Pages subpath checks</title></head><body><pre id="output">RUNNING</pre><iframe id="app" title="Pages frontend under test" style="width:375px;height:850px;border:0"></iframe><script type="module">
// Native navigation over the exact production artifact. No live Supabase requests.
const frame = document.querySelector('#app'); const output = document.querySelector('#output'); const lines = [];
const token = 'b'.repeat(64); const session = 'a'.repeat(64); const apiCalls = [];
const check = (condition, name) => { if (!condition) throw new Error(name); lines.push('PASS ' + name); output.textContent = lines.join('\n') + '\nRUNNING'; };
const wait = async predicate => { for (let i=0;i<200;i++) { if (predicate()) return; await new Promise(r=>setTimeout(r,20)); } throw new Error('UI timed out after '+lines.at(-1)); };
const event = { households:[{id:'11111111-1111-1111-1111-111111111111',name:'Maples'},{id:'22222222-2222-2222-2222-222222222222',name:'Pines'}], participants:[{id:'33333333-3333-3333-3333-333333333333',name:'Alice',email:'alice@example.test',householdId:'11111111-1111-1111-1111-111111111111',linkIssued:false}], locked:true, drawn:true };
window.pagesTestFetch = async (url, init) => {
  const endpoint = new URL(url); apiCalls.push({ endpoint, init });
  if (endpoint.protocol !== 'https:' || !endpoint.pathname.startsWith('/functions/v1/')) throw new Error('API URL accidentally depends on Pages path');
  let data;
  switch (endpoint.pathname.split('/').pop()) {
    case 'public-event': data={households:event.households,locked:false,drawn:false}; break;
    case 'admin-login': data={sessionToken:session,expiresAt:new Date(Date.now()+3600000).toISOString()}; break;
    case 'admin-data': data=event; break;
    case 'issue-reveal-token': data={token}; break;
    case 'reveal-assignment': data={participantName:'Alice',recipientName:'Bob'}; break;
    default: throw new Error('Unexpected test API operation');
  }
  return Response.json(data);
};
const doc = () => frame.contentDocument;
const navigate = async url => { await new Promise(resolve=>{frame.onload=resolve;frame.src=url;}); };
const loadedAfter = async work => { await new Promise(resolve=>{frame.onload=resolve;work();}); };
const originalSession = sessionStorage.getItem('family-secret-santa.admin-session.v1');
try {
  sessionStorage.removeItem('family-secret-santa.admin-session.v1');
  await navigate('/family-secret-santa/'); await wait(()=>doc().querySelector('#join-fields')&&!doc().querySelector('#join-fields').disabled);
  check(frame.contentWindow.location.pathname==='/family-secret-santa/','directory index loads with production JavaScript');
  check(doc().querySelector('link[rel=stylesheet]').href===location.origin+'/family-secret-santa/css/styles.css','stylesheet resolves beneath repository path');
  check(frame.contentWindow.getComputedStyle(doc().querySelector('button')).minHeight==='48px','stylesheet is fetched and applied');
  check([...doc().querySelectorAll('script[src]')].every(s=>new URL(s.src).pathname.startsWith('/family-secret-santa/js/')),'page script paths retain repository directory');
  check(doc().documentElement.scrollWidth<=375,'published home page fits mobile width');
  await loadedAfter(()=>doc().querySelector('a[href="admin.html"]').click()); await wait(()=>doc().querySelector('#login-section')&&!doc().querySelector('#login-section').hidden);
  check(frame.contentWindow.location.pathname==='/family-secret-santa/admin.html','native organizer navigation stays beneath repository path');
  doc().querySelector('#admin-password').value='test-only-password';doc().querySelector('#login-form').requestSubmit();
  await wait(()=>doc().querySelectorAll('#reveal-links .item').length===1);
  check(!doc().querySelector('#admin-content').hidden,'published organizer modules and production adapter load');
  doc().querySelector('#links-section').open=true;doc().querySelector('#reveal-links button').click();await wait(()=>!!doc().querySelector('#reveal-links input').value);
  const revealURL = doc().querySelector('#reveal-links input').value;
  check(new URL(revealURL).pathname==='/family-secret-santa/reveal.html','generated reveal URL preserves repository path');
  check(new URL(revealURL).hash==='#/reveal/'+token,'generated reveal URL preserves hash-based token');
  await navigate(revealURL);await wait(()=>doc().querySelector('#reveal-button')&&!doc().querySelector('#reveal-button').disabled);
  check(doc().querySelector('#result').hidden,'direct reveal link loads without displaying the secret');
  doc().querySelector('#reveal-button').click();await wait(()=>!doc().querySelector('#result').hidden);
  check(doc().querySelector('#giver').textContent==='Alice'&&doc().querySelector('#recipient').textContent==='Bob','reveal module uses production adapter at repository subpath');
  await loadedAfter(()=>frame.contentWindow.location.reload());await wait(()=>!doc().querySelector('#reveal-button').disabled);
  check(doc().querySelector('#result').hidden&&frame.contentWindow.location.hash==='#/reveal/'+token,'refresh retains route and hides the secret');
  await loadedAfter(()=>doc().querySelector('a[href="index.html"]').click());await wait(()=>doc().querySelector('#join-fields')&&!doc().querySelector('#join-fields').disabled);
  check(frame.contentWindow.location.pathname==='/family-secret-santa/index.html','reveal-to-home native navigation stays beneath repository path');
  for (const entry of ['/family-secret-santa/index.html','/family-secret-santa/']) {
    await navigate(entry+'#/reveal/'+token);
    await wait(()=>frame.contentWindow.location.pathname==='/family-secret-santa/reveal.html'&&doc().querySelector('#reveal-button')&&!doc().querySelector('#reveal-button').disabled);
    check(frame.contentWindow.location.hash==='#/reveal/'+token,entry+' hash alias redirects to the correct reveal page');
  }
  check(apiCalls.every(c=>c.init.headers.apikey.startsWith('sb_publishable_')&&c.init.cache==='no-store'),'published frontend sends only the public key with no-store API requests');
  for (const page of ['index.html','admin.html','reveal.html']) check((await fetch('/family-secret-santa/'+page)).ok,page+' is directly addressable in the artifact');
  for (const resource of ['supabase/migrations/20261002000100_secret_santa.sql','tests/browser.html','js/demo-service.js']) check((await fetch('/family-secret-santa/'+resource)).status===404,resource+' is excluded from published files');
  output.textContent=lines.join('\n')+'\nALL PAGES SUBPATH CHECKS PASSED';
} catch (error) { output.textContent=lines.join('\n')+'\nFAIL '+error.stack; }
finally { if(originalSession===null)sessionStorage.removeItem('family-secret-santa.admin-session.v1');else sessionStorage.setItem('family-secret-santa.admin-session.v1',originalSession); }
</script></body></html>
